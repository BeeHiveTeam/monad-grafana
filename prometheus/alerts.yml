groups:
  - name: monad-connectivity
    rules:
      # The failure that the old "Active peers" panel hid: discovery keeps
      # reporting hundreds of known peers while live wireauth sessions collapse,
      # so the node is effectively isolated but the dashboard looks fine.
      - alert: MonadPeerSessionsCollapsed
        expr: monad_wireauth_udp_state_transport_sessions < 5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Monad node has <5 live peer sessions ({{ $value }})"
          description: >-
            transport_sessions={{ $value }} for 10m. These are fully established
            wireauth sessions (actual connections). Known-via-discovery peers can
            stay high while this collapses — that is the masked-outage signature.
            Tune the threshold to your network's normal session count.

      # Explicit divergence detector: many known peers, almost no real sessions.
      - alert: MonadPeersKnownButDisconnected
        expr: monad_peer_disc_num_peers > 50 and monad_wireauth_udp_state_transport_sessions < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Monad node knows many peers but is not connected to them"
          description: >-
            num_peers={{ with query "monad_peer_disc_num_peers" }}{{ . | first | value }}{{ end }}
            but transport_sessions<5. Discovery routing table is populated while
            live sessions are gone — the node is isolated.

      # Scrape target down — metrics stopped flowing entirely.
      - alert: MonadOtelcolDown
        expr: up{job="monad-otelcol"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Monad otelcol metrics endpoint is down"
          description: "Prometheus cannot scrape host.docker.internal:8889 for 3m."

      # Upstream validators are the peers that feed this full-node proposals.
      # Below ~3 a full-node risks the "local timeout deadlock" (stops receiving
      # proposals, freezes, can't self-recover). This is the FUNCTIONAL signal —
      # more reliable than raw session count, which bursts/prunes around restarts.
      # Retuned 2026-07-30. 7 days of live data: min 1 · p05 2 · p50 3 · avg 2.92 · max 5.
      # The old threshold of 3 sat exactly on the MEDIAN — half the time the value is at or
      # below it. It happened not to fire here only because `for: 15m` absorbed the dips
      # (0 firing windows in 7 days), but a node that dips slightly longer would page
      # constantly. 2 is below p05 and still catches a genuine collapse to 0-1.
      - alert: MonadUpstreamValidatorsLow
        expr: monad_peer_disc_num_upstream_validators < 2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Monad node has <3 upstream validators ({{ $value }})"
          description: >-
            num_upstream_validators={{ $value }} for 15m. Below ~3 a full-node
            can stop receiving proposals and hit the local-timeout deadlock that
            only a restart recovers. Tune to your network's healthy value.

      # Session working-set collapsed toward single digits (but not yet <5).
      # Catches a genuine decay BEFORE it trips the <5 MonadPeerSessionsCollapsed
      # critical. Threshold 15 sits below the observed stable working set on
      # 0.14.5 (~28-42) but above the degraded ~7-10 seen before a recovery
      # restart, so it fires on a real collapse, not on the normal level.
      # 30m for: avoids the legitimate post-restart prune from the burst peak.
      # Retuned 2026-07-30 against 7 days of live data on 0.15.2 (the old threshold was set
      # for the 0.14.5 working range and predates the release):
      #   min 7 · p01 8 · p05 9 · p10 16 · p50 32 · avg 63 · max 695
      # Firing 30-minute windows in those 7 days on a healthy node:
      #   <15 → 35   <10 → 21   <8 → 2   <6 → 0
      # 35 pages a week teaches the operator to ignore the channel, which is exactly how the
      # real outage gets missed. 8 sits below p01 and still leaves headroom above the
      # MonadPeerSessionsCollapsed critical at 5.
      - alert: MonadPeerSessionsDecayed
        expr: monad_wireauth_udp_state_transport_sessions < 8
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Monad live peer sessions decayed to {{ $value }} (recovery restart usually helps)"
          description: >-
            transport_sessions={{ $value }} for 30m, below this node's healthy
            working set. Signal of a peering/session-management slide toward
            isolation; a monad-bft restart typically restores it. If it recurs,
            report it. Tune the threshold (15) to your node's observed baseline.

  # ---------------------------------------------------------------------------
  # Liveness. Added after the 2026-07 audit: the stack shipped five rules, all
  # about peer sessions and otelcol, and NOT ONE about the simplest failure —
  # "the node is not running". A crashed monad-bft, a dead local RPC, a stalled
  # chain and a filling disk all produced zero alerts.
  # ---------------------------------------------------------------------------
  - name: monad-liveness
    rules:
      - alert: MonadServiceDown
        expr: monad_service_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Monad service {{ $labels.service }} is DOWN"
          description: >-
            monad_service_up{service="{{ $labels.service }}"}=0 for 2m. Check
            `systemctl status {{ $labels.service }}` and
            `journalctl -u {{ $labels.service }} -n 200`.

      # Absent, not zero: the exporter deliberately stops publishing block/gap
      # series when it has no data, so absence is the signal.
      # Same gate: with no monad-rpc there is no block data to publish, and the absence is
      # expected rather than a fault.
      - alert: MonadExporterNoData
        expr: >-
          (absent(monad_last_block_age_seconds) or absent(monad_rpc_local_up))
          and on() (count(monad_service_up{service="monad-rpc"}) > 0)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Monad exporter is publishing no block data"
          description: >-
            monad_last_block_age_seconds / monad_rpc_local_up missing for 5m. Either the
            exporter cannot reach the node's RPC, or the exporter itself is broken. This is
            NOT "everything is fine" — the metric is withheld precisely because the value
            is unknown.

      # Gated on the monad-rpc unit actually existing. install.sh allows a validator without
      # monad-rpc; on such a node the exporter can never reach a local RPC, so this rule pinned
      # a critical forever. The exporter only publishes monad_service_up for units present on
      # the host, so the join disappears together with the service.
      - alert: MonadLocalRpcDown
        expr: monad_rpc_local_up == 0 and on() (count(monad_service_up{service="monad-rpc"}) > 0)
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Monad local RPC is not responding"
          description: "eth_blockNumber against the local node has failed for 3m."

      - alert: MonadBlockStalled
        expr: monad_last_block_age_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No new block for {{ $value }}s"
          description: >-
            Chain head has not advanced. At ~300ms block time anything beyond a
            minute means consensus or execution is stuck.

      - alert: MonadSyncGapGrowing
        expr: monad_sync_gap_blocks > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node is {{ $value }} blocks behind the network"
          description: >-
            Sync gap above 2000 blocks for 10m. Published only when local and public
            RPC are confirmed to be the same chain.

      - alert: MonadTargetDown
        expr: up{job=~"node-exporter|monad-rpc-exporter"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: >-
            Scrape target unreachable for 5m — monitoring itself is partially blind.

  - name: monad-host
    rules:
      - alert: NodeDiskFillingUp
        expr: >-
          predict_linear(node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs"}[6h], 4*3600) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} projected to fill within 4h"
          description: >-
            Linear projection over the last 6h has {{ $labels.mountpoint }} running out of
            space within 4 hours. A full disk stops the node (and Prometheus TSDB).

      - alert: NodeDiskAlmostFull
        expr: >-
          1 - (node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs"}
               / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs|zfs"}) > 0.90
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} is over 90% full"
          description: "Free space below 10% for 15m."

  # ---------------------------------------------------------------------------
  # TrieDB. Added after the 2026-07 audit found the node's primary data device
  # invisible to every disk alert: /dev/triedb is a RAW block device with no
  # filesystem, so node_filesystem_* never covers it and the NodeDisk* rules
  # above — which filter on fstype — exclude it by construction. Fed by
  # scripts/triedb-textfile-exporter.sh via the node_exporter textfile collector.
  # ---------------------------------------------------------------------------
  - name: monad-triedb
    rules:
      - alert: MonadTriedbAlmostFull
        expr: monad_triedb_used_ratio > 0.85
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "TrieDB {{ $labels.device }} is {{ $value | humanizePercentage }} full"
          description: >-
            The node writes state into this device; when it fills, execution stops.
            Neither df nor node_filesystem_* can see it — this is the only signal.

      - alert: MonadTriedbFillingUp
        expr: predict_linear(monad_triedb_used_bytes[12h], 48*3600) > on(device, instance) monad_triedb_capacity_bytes
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TrieDB {{ $labels.device }} projected to fill within 48h"
          description: >-
            Linear projection over the last 12h. TrieDB growth is steady, so this fires
            long before the hard threshold and leaves time to resize or prune.

      # A stale .prom file is indistinguishable from a fresh one: the textfile collector serves
      # its contents on every scrape, so if the script stops RUNNING (timer disabled, unit lost
      # in an OS upgrade, mktemp failing on a full root filesystem before the trap is even set)
      # Prometheus keeps seeing probe_ok=1 and a frozen percentage — and none of the three rules
      # here can ever fire. probe_ok alone therefore cannot detect the failure it exists for.
      - alert: MonadTriedbMetricsStale
        expr: >-
          absent(monad_triedb_probe_ok)
          or (time() - node_textfile_mtime_seconds{file=~".*monad_triedb\\.prom"} > 600)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "TrieDB metrics are stale or missing"
          description: >-
            The textfile has not been rewritten for over 10 minutes (the timer runs every
            minute), or the metric is gone entirely. TrieDB fullness is unmonitored — the value
            you see may be frozen. Check: systemctl status monad-triedb-exporter.timer

      - alert: MonadTriedbProbeFailing
        expr: monad_triedb_probe_ok == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "TrieDB capacity probe is failing"
          description: >-
            monad-mpt could not be read for 30m, so TrieDB fullness is unmonitored.
            The exporter deliberately publishes no capacity series when it has no data —
            do not read the missing metric as "empty".
